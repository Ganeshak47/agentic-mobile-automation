name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m compileall src run_demo.py
      # Device-dependent tests are skipped in CI (no emulator).
      # The agent-schema test requires ANTHROPIC_API_KEY as a repo secret:
      # - name: Agent schema test
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: pytest tests/test_agentic_flows.py::test_agent_generates_valid_schema
